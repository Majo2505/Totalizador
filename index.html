<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Totalizador de Compras</title>
  </head>
  <body>
    <h1>Totalizador de Compras</h1>

    <form id="totalizador-form">
      <div>
        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" placeholder="Ej: 10" required />
      </div>

      <div>
        <label for="precio">Precio por ítem ($):</label>
        <input type="number" step="0.01" id="precio" placeholder="Ej: 400" required />
      </div>

      <div>
        <label for="estado">Estado:</label>
        <select id="estado" required>
          <option value="UT">UT (Utah - 6.65%)</option>
          <option value="NV">NV (Nevada - 8.00%)</option>
          <option value="TX">TX (Texas - 6.25%)</option>
          <option value="AL">AL (Alabama - 4.00%)</option>
          <option value="CA">CA (California - 8.25%)</option>
        </select>
      </div>

      <div>
        <label for="categoria">Categoría:</label>
        <select id="categoria" required>
          <option value="Alimentos">Alimentos</option>
          <option value="Bebidas alcoholicas">Bebidas alcohólicas</option>
          <option value="Material de escritorio">Material de escritorio</option>
          <option value="Muebles">Muebles</option>
          <option value="Electronicos">Electrónicos</option>
          <option value="Vestimenta">Vestimenta</option>
          <option value="Varios">Varios</option>
        </select>
      </div>

      <div>
        <label for="peso">Peso Volumétrico (kg):</label>
        <input type="number" step="0.1" id="peso" placeholder="Ej: 15" required />
      </div>

      <div>
        <label for="tipo-cliente">Tipo de Cliente:</label>
        <select id="tipo-cliente" required>
          <option value="Normal">Normal</option>
          <option value="Recurrente">Recurrente</option>
          <option value="Antiguo Recurrente">Antiguo Recurrente</option>
          <option value="Especial">Especial</option>
        </select>
      </div>

      <br />
      <input type="submit" value="Calcular Total" id="calcular-btn" />
    </form>

    <hr />

    <h2>Desglose de Compra</h2>
    <div id="resultado-div">
      <p>Ingrese los datos y presione "Calcular Total" para ver el desglose.</p>
    </div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
